name: CI

on:
  push:
    branches: [main, nightly]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test, build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 is what the panel image runs; 24 is what the sandbox image runs.
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      # Real-pi tests skip themselves unless PI_SDK_ENTRY and friends are set.
      - run: npm test
      - run: npm run build

  images:
    name: Build Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Panel image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha,scope=panel
          cache-to: type=gha,mode=max,scope=panel
      - name: Updater image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: updater
          push: false
          load: true
          tags: pi-panel-updater:ci
          cache-from: type=gha,scope=panel
      - name: Updater image has what it needs
        run: |
          docker run --rm pi-panel-updater:ci sh -c '
            git --version && docker compose version && which setpriv &&
            node -e "import(\"/updater/updater-main.js\").then(() => console.log(\"updater module loads\"))"'
      - name: Sandbox image
        uses: docker/build-push-action@v6
        with:
          context: docker/base
          push: false
          cache-from: type=gha,scope=sandbox
          cache-to: type=gha,mode=max,scope=sandbox
