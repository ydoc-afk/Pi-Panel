version: 2
updates:
  # Feature work lands on nightly first, so dependency updates do too.
  - package-ecosystem: npm
    directory: /
    target-branch: nightly
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    target-branch: nightly
    schedule:
      interval: monthly
  # pi itself is pinned with a build arg (docker/base/Dockerfile) and upgraded deliberately;
  # this only bumps the Node base images.
  - package-ecosystem: docker
    directories: [/, /docker/base]
    target-branch: nightly
    schedule:
      interval: monthly
