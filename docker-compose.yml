services:
  pi-panel:
    build: .
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '3000:3000'
    environment:
      DATA_DIR: /data
      # The Docker daemon resolves bind-mount paths on the host, so it must know where /data lives there.
      # Run `docker compose up` from the repository root so ${PWD}/data is the directory mounted below.
      PI_PANEL_HOST_DATA_DIR: ${PWD}/data
      # Behind a reverse proxy (Caddy, Tailscale Serve, ...), set to 'true' so sign-in throttling sees
      # real client addresses. Only do this when the proxy is the only way to reach the panel.
      TRUST_PROXY: ${PI_PANEL_TRUST_PROXY:-false}
      # Per-project sandbox limits.
      SANDBOX_MEMORY_MB: ${PI_PANEL_SANDBOX_MEMORY_MB:-2048}
      SANDBOX_CPUS: ${PI_PANEL_SANDBOX_CPUS:-2}
    volumes:
      - ./data:/data
      # The backend is the only component that talks to Docker (project sandboxes).
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  # Built on demand; project containers are created from this image.
  sandbox-base:
    build: ./docker/base
    image: pi-panel/sandbox-base:latest
    profiles: ['build-only']

  # REA reverse-engineering server. Optional, build with:
  #   GHIDRA_URL=... GHIDRA_SHA256=... docker compose --profile build-only build rea
  rea:
    build:
      context: ./docker/rea
      args:
        GHIDRA_URL: ${GHIDRA_URL:-}
        GHIDRA_SHA256: ${GHIDRA_SHA256:-}
    image: pi-panel/rea:6.8.0
    profiles: ['build-only']

  # Runtime profiles of the sandbox image. Optional; projects pick one in their Runtime tab, which
  # can also build them. Each is layered on the one before it: sandbox-base, python, native, full.
  sandbox-python:
    build:
      context: ./docker/runtimes/python
      args:
        BASE_IMAGE: pi-panel/sandbox-base:latest
    image: pi-panel/sandbox-python:latest
    profiles: ['build-only']
  sandbox-native:
    build:
      context: ./docker/runtimes/native
      args:
        BASE_IMAGE: pi-panel/sandbox-python:latest
    image: pi-panel/sandbox-native:latest
    profiles: ['build-only']
  sandbox-full:
    build:
      context: ./docker/runtimes/full
      args:
        BASE_IMAGE: pi-panel/sandbox-native:latest
    image: pi-panel/sandbox-full:latest
    profiles: ['build-only']
