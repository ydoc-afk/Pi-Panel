services:
  pi-panel:
    build: .
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '3000:3000'
    environment:
      DATA_DIR: /data
      # The Docker daemon resolves bind-mount paths on the host, so it must know where /data lives there.
      # Run `docker compose up` from the repository root so ${PWD}/data is the directory mounted below.
      PI_PANEL_HOST_DATA_DIR: ${PWD}/data
      # Behind a reverse proxy (Caddy, Tailscale Serve, ...), set to 'true' so sign-in throttling sees
      # real client addresses. Only do this when the proxy is the only way to reach the panel.
      TRUST_PROXY: ${PI_PANEL_TRUST_PROXY:-false}
      # Per-project sandbox limits.
      SANDBOX_MEMORY_MB: ${PI_PANEL_SANDBOX_MEMORY_MB:-2048}
      SANDBOX_CPUS: ${PI_PANEL_SANDBOX_CPUS:-2}
    volumes:
      - ./data:/data
      # The backend is the only component that talks to Docker (project sandboxes).
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  # Updates the panel from this checkout when the admin presses Update in the panel (Updates page).
  # It runs git and docker compose here, so it has the Docker socket (as the panel does) and write
  # access to this directory, mounted at the same path as on the host so ./data resolves the same.
  # No port is published; the panel reaches it on the compose network with a token kept in ./data.
  # Remove this service to turn in-panel updates off.
  updater:
    build:
      context: .
      target: updater
    working_dir: ${PWD}
    environment:
      PI_PANEL_REPO: ${PWD}
      # Branches this panel may follow. A test instance can narrow it to nightly.
      PI_PANEL_CHANNELS: ${PI_PANEL_CHANNELS:-main,nightly}
      # How often to look for new commits; 0 turns the background check off.
      PI_PANEL_UPDATE_CHECK_HOURS: ${PI_PANEL_UPDATE_CHECK_HOURS:-6}
    volumes:
      - ${PWD}:${PWD}
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  # Built on demand; project containers are created from this image.
  sandbox-base:
    build: ./docker/base
    image: pi-panel/sandbox-base:latest
    profiles: ['build-only']

  # REA reverse-engineering server. Optional, build with:
  #   GHIDRA_URL=... GHIDRA_SHA256=... docker compose --profile build-only build rea
  rea:
    build:
      context: ./docker/rea
      args:
        GHIDRA_URL: ${GHIDRA_URL:-}
        GHIDRA_SHA256: ${GHIDRA_SHA256:-}
    image: pi-panel/rea:6.8.0
    profiles: ['build-only']
