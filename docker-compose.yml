services:
  pi-panel:
    build: .
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '3000:3000'
    environment:
      DATA_DIR: /data
      # The Docker daemon resolves bind-mount paths on the host, so it must know where /data lives there.
      # Run `docker compose up` from the repository root so ${PWD}/data is the directory mounted below.
      PI_PANEL_HOST_DATA_DIR: ${PWD}/data
    volumes:
      - ./data:/data
      # The backend is the only component that talks to Docker (project sandboxes).
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  # Built on demand; project containers are created from this image.
  sandbox-base:
    build: ./docker/base
    image: pi-panel/sandbox-base:latest
    profiles: ['build-only']

  # REA reverse-engineering server. Optional, build with:
  #   GHIDRA_URL=... GHIDRA_SHA256=... docker compose --profile build-only build rea
  rea:
    build:
      context: ./docker/rea
      args:
        GHIDRA_URL: ${GHIDRA_URL:-}
        GHIDRA_SHA256: ${GHIDRA_SHA256:-}
    image: pi-panel/rea:6.8.0
    profiles: ['build-only']
